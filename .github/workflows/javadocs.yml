name: Javadocs

on:
  push:
    paths:
    - 'src/**'
    - 'build.gradle.kts'

permissions:
  contents: read

jobs:
  build:
    name: Gradle Javadocs
    runs-on: ubuntu-latest

    steps:
    - name: Checkout repository
      uses: actions/checkout@v4

    - name: Set up JDK 21
      uses: actions/setup-java@v4.6.0
      with:
        distribution: 'adopt'
        java-version: '21'
        java-package: jdk
        architecture: x64

    - name: Build Javadocs
      uses: gradle/actions/setup-gradle@v4
    - run: ./gradlew javadoc
