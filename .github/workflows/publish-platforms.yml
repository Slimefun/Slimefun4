name: Publish to platforms

# Fires on a release tag (e.g. v5.2.2). Builds the universal jar with the tag as its version
# (so plugin.yml reports e.g. 5.2.2, NOT 5.0.0-UNOFFICIAL) and uploads it to Modrinth and Hangar.
#
# NOTE on SpigotMC: SpigotMC has no public resource-upload API, so it CANNOT be automated here —
# upload the same jar manually to the SpigotMC resource page after the release.
#
# Required repo secrets:  MODRINTH_TOKEN, HANGAR_TOKEN
# Required repo variables: MODRINTH_ID (project id/slug), HANGAR_ID (project slug, e.g. Slimefun5/Slimefun)
on:
  push:
    tags:
      - "v*"

permissions:
  contents: write

jobs:
  publish:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Set up JDK 21
        uses: actions/setup-java@v4
        with:
          java-version: "21"
          distribution: temurin

      - name: Setup Gradle
        uses: gradle/actions/setup-gradle@v4

      - name: Build universal jar (version from tag)
        run: ./gradlew :core:shadowJar -Partifact_version=${{ github.ref_name }} --no-daemon

      - name: Stage a clean jar name
        run: |
          mkdir -p upload
          cp core/build/libs/Slimefun*.jar "upload/Slimefun-${{ github.ref_name }}.jar"

      - name: Publish to Modrinth + Hangar
        uses: Kir-Antipov/mc-publish@v3.3
        with:
          files: upload/Slimefun-*.jar
          name: Slimefun ${{ github.ref_name }}
          version: ${{ github.ref_name }}
          version-type: release
          # Universal jar: runs on 1.8.8 through the latest. Trim/extend this list to match the
          # versions you want listed on the project pages.
          game-versions: |
            1.8.9
            1.12.2
            1.16.5
            1.18.2
            1.19.4
            1.20.6
            1.21.4
          loaders: |
            paper
            spigot
            bukkit

          modrinth-id: ${{ vars.MODRINTH_ID }}
          modrinth-token: ${{ secrets.MODRINTH_TOKEN }}

          hangar-id: ${{ vars.HANGAR_ID }}
          hangar-token: ${{ secrets.HANGAR_TOKEN }}

          github-tag: ${{ github.ref_name }}
          github-token: ${{ secrets.GITHUB_TOKEN }}
