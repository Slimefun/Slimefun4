name: Release

on:
  push:
    tags:
      - 'v*'

permissions:
  contents: write

jobs:
  release:
    name: Merge, Build and Release
    runs-on: ubuntu-latest

    steps:
    - name: Checkout repository
      uses: actions/checkout@v4
      with:
        fetch-depth: 0

    - name: Merge tag into stable
      run: |
        git config user.name "github-actions[bot]"
        git config user.email "github-actions[bot]@users.noreply.github.com"
        git checkout stable
        git merge ${{ github.sha }} --no-edit
        git push origin stable

    - name: Set version from tag
      run: |
        VERSION="${GITHUB_REF_NAME#v}"
        echo "VERSION=$VERSION" >> "$GITHUB_ENV"
        sed -i "s/<version>5.0.0-UNOFFICIAL<\/version>/<version>$VERSION<\/version>/g" pom.xml

    - name: Set up JDK 21
      uses: actions/setup-java@v4.6.0
      with:
        distribution: 'adopt'
        java-version: '21'
        java-package: jdk
        architecture: x64

    - name: Cache Maven packages
      uses: actions/cache@v4
      with:
        path: ~/.m2
        key: ${{ runner.os }}-m2-${{ hashFiles('**/pom.xml') }}
        restore-keys: ${{ runner.os }}-m2

    - name: Build with Maven
      run: mvn clean package -Dmaven.test.skip=true --file pom.xml

    - name: Create GitHub Release
      uses: softprops/action-gh-release@v2
      with:
        files: 'target/Slimefun v${{ env.VERSION }}.jar'
        generate_release_notes: true
      env:
        GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
