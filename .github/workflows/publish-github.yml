name: Publish to GitHub only

# A lightweight, GitHub-only release of the core jar — no Modrinth, no Hangar.
# Use this for builds that addons need to consume via github-gradle (e.g. a new core API like
# ItemGroup#setTheme) but that aren't worth a full Modrinth/Hangar release.
#
# Trigger either way:
#   - push a tag matching gh-v* (e.g. gh-v5.2.3), or
#   - run this workflow manually (Actions tab) with a version input.
#
# github-gradle consumers reference the resulting tag, e.g.  Slimefun5:Slimefun5:gh-v5.2.3
#
# The normal full release path (v* -> GitHub + Modrinth + Hangar via the @stable reusable in
# publish-platforms.yml) is unaffected: gh-v* does not match the v* filter.

on:
  push:
    tags:
      - "gh-v*"
  workflow_dispatch:
    inputs:
      version:
        description: "Version to publish (e.g. 5.2.3) — creates/uses tag gh-v<version>"
        required: true
        type: string

permissions:
  contents: write

jobs:
  publish-github:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Set up JDK 21
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "21"

      - name: Resolve version and tag
        id: ver
        run: |
          if [ "${{ github.event_name }}" = "workflow_dispatch" ]; then
            VERSION="${{ github.event.inputs.version }}"
            TAG="gh-v${VERSION}"
          else
            TAG="${GITHUB_REF_NAME}"
            VERSION="${TAG#gh-v}"
          fi
          echo "version=$VERSION" >> "$GITHUB_OUTPUT"
          echo "tag=$TAG" >> "$GITHUB_OUTPUT"

      - name: Build core jar
        run: |
          chmod +x ./gradlew
          ./gradlew :core:shadowJar -Partifact_version="${{ steps.ver.outputs.version }}" --no-daemon

      - name: Publish GitHub release (GitHub only)
        uses: softprops/action-gh-release@v2
        with:
          tag_name: ${{ steps.ver.outputs.tag }}
          name: "Slimefun ${{ steps.ver.outputs.version }} (GitHub build)"
          body: |
            GitHub-only build of Slimefun core for github-gradle consumers (addons).
            Not published to Modrinth or Hangar. Consume via `Slimefun5:Slimefun5:${{ steps.ver.outputs.tag }}`.
          prerelease: true
          files: core/build/libs/*.jar
