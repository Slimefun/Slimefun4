research:
  - "&7Many Slimefun items must be researched before you can use them."
  - "&7Researching costs experience levels and unlocks the item permanently"
  - "&7for your profile, gating progression behind exploration and effort."
energy:
  - "&7Machines and gadgets run on an energy network. Generators produce"
  - "&7energy, capacitors store it, and machines consume it. Connect them"
  - "&7with an Energy Regulator to power your setup."
cargo:
  - "&7The cargo network moves items between machines and chests."
  - "&7Cargo nodes filter and route items along a Cargo Manager, letting"
  - "&7you automate sorting, input and output across your base."
multiblocks:
  - "&7Multiblocks are structures built from vanilla blocks in a fixed shape."
  - "&7Once assembled, interacting with the trigger block performs a recipe."
  - "&7They require no energy and are ideal for early-game automation."
