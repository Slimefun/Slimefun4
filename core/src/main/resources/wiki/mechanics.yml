# In-game wiki topic guides, keyed by topic id (see WikiText#getMechanic and WikiIndex topics()).
# Rendered as paginated tooltip text on the topic page. Keep lines short (~45 chars).

getting_started:
  - '&e&lGetting Started'
  - '&7Welcome to Slimefun! This guide'
  - '&7teaches you the basics.'
  - ''
  - '&71. Craft the Slimefun Guide'
  - '&7   Book: place a Book in the'
  - '&7   center of a crafting grid,'
  - '&7   surround it with 8 Iron'
  - '&7   Ingots.'
  - '&72. Right-click while holding'
  - '&7   it to open this guide.'
  - '&73. Browse the categories to'
  - '&7   see every item and recipe.'
  - ''
  - '&e&lYour First Items'
  - '&7Items start &clocked&7. Click a'
  - '&7locked item to research it'
  - '&7(see the Research topic).'
  - ''
  - '&7Build the &bEnhanced Crafting'
  - '&7Table&7 first: it crafts most'
  - '&7Slimefun gear. Place a Vanilla'
  - '&7Crafting Table with a Dispenser'
  - '&7directly below it.'
  - ''
  - '&7To use it, put the 3x3 recipe'
  - '&7into the Dispenser and'
  - '&7right-click the table.'
  - ''
  - '&e&lNext Steps'
  - '&7Set up &bOre processing&7 to'
  - '&7double your ores, then a'
  - '&bSmeltery&7 to make alloys.'
  - '&7From there you progress toward'
  - '&aelectric machines&7 powered by'
  - '&7generators and cables.'
  - ''
  - '&7Take it one machine at a time'
  - '&7and have fun!'

research:
  - '&e&lThe Research System'
  - '&7Every Slimefun item begins'
  - '&clocked&7 for you. You must'
  - '&7research it before you can'
  - '&7craft or use it.'
  - ''
  - '&e&lHow to Research'
  - '&71. Open the Slimefun Guide.'
  - '&72. Click a locked item.'
  - '&73. If you have enough XP'
  - '&7   levels, it unlocks.'
  - ''
  - '&7Research costs &aexperience'
  - '&alevels&7 (the green bar). The'
  - '&7level cost varies per item.'
  - '&7You must actually have that'
  - '&7level or it will not unlock.'
  - ''
  - '&7Once researched, the item is'
  - '&aunlocked permanently&7 for you.'
  - '&7Other players research their'
  - '&7own copies separately.'
  - ''
  - '&7Some items are gated behind'
  - '&7prerequisites: research the'
  - '&7earlier items in a line first.'
  - ''
  - '&e&lAdmin Command'
  - '&7Staff can grant research with:'
  - '&b/sf research <player> <id>'
  - '&7Use &ball&7 to unlock'
  - '&7everything, or &breset&7 to'
  - '&7clear a player''s research.'

multiblocks:
  - '&e&lMultiblock Machines'
  - '&7Multiblocks are simple machines'
  - '&7you build by hand from vanilla'
  - '&7blocks in an exact shape.'
  - '&7No energy, no GUI.'
  - ''
  - '&7Most use a &edispenser&7 as the'
  - '&7trigger block. Hold your input'
  - '&7items and &eright-click&7 the'
  - '&7trigger to craft. The Guide'
  - '&7shows the exact build layout'
  - '&7for each machine.'
  - ''
  - '&e&lCommon machines'
  - '&7- Enhanced Crafting Table'
  - '&7- Smeltery'
  - '&7- Ore Crusher'
  - '&7- Grind Stone'
  - '&7- Armor Forge'
  - '&7- Magic Workbench'
  - ''
  - '&eTip:&7 build at the right height'
  - '&7and orientation, or it will not'
  - '&7form. Check the Guide layout.'

ore_processing:
  - '&e&lOre Processing'
  - '&7These multiblocks let you'
  - '&adouble&7 your ores and turn'
  - '&7junk blocks into resources.'
  - ''
  - '&e&lOre Crusher'
  - '&7Crushes ore into &a2 dusts&7,'
  - '&7doubling your yield. Put ore'
  - '&7in the dispenser and'
  - '&7right-click the trigger.'
  - ''
  - '&e&lGrind Stone'
  - '&7Grinds items into powders'
  - '&7(Blaze Rod to Blaze Powder,'
  - '&7Bone to Bone Meal, etc.).'
  - ''
  - '&e&lOre Washer'
  - '&7Washes &bSifted Ore&7 into a'
  - '&7random pure ore dust, using a'
  - '&7cauldron-based multiblock.'
  - ''
  - '&e&lGold Pan'
  - '&7Sift Gravel with a Gold Pan to'
  - '&7get flint, clay and nuggets.'
  - '&7A &bNether Gold Pan&7 sifts'
  - '&7Soul Sand for Nether goodies.'
  - ''
  - '&e&lGoing Electric'
  - '&7Later the &aElectric Ore'
  - '&aGrinder&7 crushes ores'
  - '&7automatically using power.'

smeltery:
  - '&e&lThe Smeltery'
  - '&7The Smeltery is a multiblock'
  - '&7that smelts dusts into ingots'
  - '&aand&7 combines metals into'
  - '&6alloys&7.'
  - ''
  - '&e&lBuilding It'
  - '&7It needs a &cfire source&7 in'
  - '&7the block directly below.'
  - '&7Light a fire under it, drop'
  - '&7your inputs in the dispenser,'
  - '&7and right-click to smelt.'
  - '&7Check the Guide for the exact'
  - '&7Nether-brick build.'
  - ''
  - '&e&lThe Ignition Chamber'
  - '&7The fire can burn out over'
  - '&7time. Place an &bIgnition'
  - '&bChamber&7 holding Flint and'
  - '&7Steel next to it to auto-'
  - '&7relight and avoid burnout.'
  - ''
  - '&e&lWhat Are Alloys?'
  - '&7Alloys mix several metals into'
  - '&7stronger ingots, such as:'
  - '&7- &6Duralumin&7 (aluminum mix)'
  - '&7- &6Steel&7 (iron + carbon)'
  - '&7- &6Bronze&7, &6Brass&7, &6Billon'
  - '&7Add the dusts/ingots together'
  - '&7in the dispenser to craft them.'
  - ''
  - '&e&lElectric Smeltery'
  - '&7A powered upgrade that makes'
  - '&6alloys only&7 - it will not do'
  - '&7plain dust-to-ingot smelting.'

energy:
  - '&e&lEnergy Networks'
  - '&7Slimefun machines run on energy,'
  - '&7measured in Joules (&eJ&7).'
  - '&7Energy flows through a network'
  - '&7that you build.'
  - ''
  - '&e&lStarting a network'
  - '&7Place an &bEnergy Regulator&7. It'
  - '&7is the heart of the network and'
  - '&7shows a floating hologram.'
  - '&7Only ONE Regulator per network.'
  - ''
  - '&e&lThe three roles'
  - '&7- &lGenerators&7 produce energy.'
  - '&7- &lCapacitors&7 store surplus.'
  - '&7- &lMachines&7 consume energy.'
  - ''
  - '&e&lConnecting it all'
  - '&7Components must be within &b6'
  - '&7blocks&7 of each other, chained'
  - '&7back to the Regulator. Use'
  - '&bEnergy Connectors&7 to bridge'
  - '&7gaps and extend reach.'
  - ''
  - '&e&lReading the network'
  - '&7The hologram shows the balance:'
  - '&a+ &7surplus (storing energy), or'
  - '&c- &7deficit (not enough power).'
  - '&7If supply is short, some'
  - '&7machines stall until it refills.'
  - ''
  - '&e&lThe Multimeter'
  - '&7Right-click a machine, capacitor'
  - '&7or generator with a &bMultimeter'
  - '&7to read its stored charge.'

power_generation:
  - '&e&lGenerating Power'
  - '&7Every network needs generators'
  - '&7to feed energy in. Pick a source'
  - '&7that fits your materials.'
  - ''
  - '&e&lSolar Generators'
  - '&7Generate energy in direct'
  - '&7sunlight (needs open sky).'
  - '&7Higher tiers output far more;'
  - '&7only the top tier works at'
  - '&7night. Rain stops output and'
  - '&7they give nothing underground.'
  - ''
  - '&e&lCoal & Lava Generators'
  - '&7Burn fuel in their input slot.'
  - '&7Coal, charcoal, blocks, wood'
  - '&7and even boats work in the Coal'
  - '&7Generator; the Lava Generator'
  - '&7burns lava buckets. Better'
  - '&7fuels burn longer.'
  - ''
  - '&e&lBio Reactor'
  - '&7Consumes organic matter -'
  - '&7saplings, flowers, crops, seeds.'
  - '&7Cheap, but lower output.'
  - ''
  - '&e&lCombustion Reactor'
  - '&7Burns &bOil&7 and &bFuel&7 buckets'
  - '&7for a large output and returns'
  - '&7the empty bucket. A strong'
  - '&7high-end power source.'
  - ''
  - '&e&lBuffering'
  - '&7Add &bCapacitors&7 to bank surplus'
  - '&7for when demand peaks, and craft'
  - '&7higher-tier generators for more'
  - '&7output without more blocks.'

electric_machines:
  - '&e&lPowered Machines'
  - '&7Electric machines do the same'
  - '&7jobs as the early multiblocks,'
  - '&7but draw from an Energy Network'
  - '&7instead of fuel or a manual'
  - '&7multiblock setup.'
  - ''
  - '&e&lExamples'
  - '&7- Electric Furnace: smelts ores'
  - '&7- Electric Ore Grinder'
  - '&7- Electric Smeltery: alloys'
  - '&7- Auto Enchanter / Disenchanter'
  - '&7- Auto Anvil: repairs gear'
  - '&7- Carbon Press & Electric Press'
  - ''
  - '&e&lHow they work'
  - '&71. Place it within range of'
  - '&7   your Energy Network.'
  - '&72. Make sure the network has a'
  - '&7   surplus (Regulator shows &a+&7).'
  - '&73. Put materials in the top'
  - '&7   slots; collect results below.'
  - ''
  - '&7Each stores a little energy and'
  - '&7spends some every tick. If its'
  - '&7charge runs out it pauses until'
  - '&7the network refills it.'
  - ''
  - '&e&lTiers'
  - '&7Higher tiers process faster but'
  - '&7use more energy per tick. Make'
  - '&7sure your generators can keep up'
  - '&7before upgrading.'
  - ''
  - '&7&oTip: feed machines with a Cargo'
  - '&7&oNetwork to fully automate them.'

cargo:
  - '&e&lCargo Networks'
  - '&7A Cargo Network moves items'
  - '&7between chests and machines'
  - '&7automatically.'
  - ''
  - '&e&lBuilding it'
  - '&7Place a &bCargo Manager&7 - the'
  - '&7core, like the Energy Regulator.'
  - '&7Attach nodes to the faces of'
  - '&7chests and machines, and link'
  - '&7everything with &bCargo Nodes'
  - '&7within &b5 blocks&7.'
  - ''
  - '&e&lThe two terminal nodes'
  - '&7- &lInput Node&7: pulls items OUT'
  - '&7  of the block it is on.'
  - '&7- &lOutput Node&7: deposits items'
  - '&7  INTO the block it is on.'
  - ''
  - '&e&lChannels'
  - '&7Each node has a channel (&b0&7-&b15&7).'
  - '&7Items pulled on a channel only go'
  - '&7to Outputs on the SAME channel.'
  - '&7Use channels to keep item'
  - '&7streams separate.'
  - ''
  - '&e&lFiltering'
  - '&7Input Nodes and the &bAdvanced'
  - '&bOutput Node&7 have a filter:'
  - '&7- &lWhitelist&7: only listed items'
  - '&7- &lBlacklist&7: block listed items'
  - '&7(The basic Output Node accepts'
  - '&7anything.)'
  - ''
  - '&e&lExample: auto-sorter'
  - '&7Input Node on a source chest,'
  - '&7channel 0. Add an Advanced'
  - '&7Output per item type, channel 0,'
  - '&7each whitelisting one item. They'
  - '&7sort themselves into chests.'

androids:
  - '&e&lProgrammable Androids'
  - '&7Place an android, then open it'
  - '&7to edit its &eMemory Core&7 - a'
  - '&7script of actions it repeats.'
  - ''
  - '&7Actions include turning, moving,'
  - '&7digging, mining, farming,'
  - '&7chopping trees, fishing and'
  - '&7attacking. The script loops'
  - '&7from start to finish forever.'
  - ''
  - '&7Androids run on &efuel&7 (coal,'
  - '&7lava, even nuclear fuel on'
  - '&7higher tiers). Higher tiers'
  - '&7burn fuel more efficiently.'
  - ''
  - '&e&lProfessions'
  - '&7Miner, Farmer, Woodcutter,'
  - '&7Butcher and Fisherman.'
  - ''
  - '&e&lInterfaces'
  - '&7Place &bAndroid Interfaces&7 next'
  - '&7to it: a fuel interface to'
  - '&7refuel it, an item interface to'
  - '&7collect its output.'

geo_mining:
  - '&e&lGEO Mining & Oil'
  - '&7Some resources are hidden in the'
  - '&7ground per chunk - mainly &bOil&7'
  - '&7and Nether Ice.'
  - ''
  - '&e&lScanning'
  - '&7Use a &bGEO Scanner&7 (or the'
  - '&7Portable version) to survey the'
  - '&7chunk you stand in. It reports'
  - '&7what lies below and how much.'
  - ''
  - '&e&lOil Pump'
  - '&7Build and power an &bOil Pump&7'
  - '&7in a chunk that contains oil.'
  - '&7It slowly extracts Buckets of'
  - '&7Oil while it has energy.'
  - ''
  - '&e&lRefinery'
  - '&7Feed Oil into a &bRefinery&7 to'
  - '&7produce &bBuckets of Fuel&7.'
  - ''
  - '&e&lUsing the fuel'
  - '&7Burn Oil or Fuel buckets in a'
  - '&bCombustion Reactor&7 for strong'
  - '&7power - the empty bucket comes'
  - '&7back.'
  - ''
  - '&7&oOil is finite per chunk, so'
  - '&7&oscan widely.'

gps:
  - '&e&lGPS & Teleportation'
  - '&7First build and power a'
  - '&bGPS Transmitter&7 to put a'
  - '&7satellite in orbit. More and'
  - '&7higher transmitters raise your'
  - '&7network &ecomplexity&7, which'
  - '&7speeds up teleporting.'
  - ''
  - '&e&lWaypoints'
  - '&7Use the &bGPS Control Panel&7 to'
  - '&7manage waypoints, and a'
  - '&bMarker Tool&7 to set them. The'
  - '&bEmergency Transmitter&7 auto-'
  - '&7marks your death spot.'
  - ''
  - '&e&lTeleporters'
  - '&7Build a Teleporter: a ring of'
  - '&7Pylons around a Teleportation'
  - '&7Matrix with an activation'
  - '&7device. Travel to any waypoint.'
  - ''
  - '&7Carry a &bPortable Teleporter&7'
  - '&7to jump to waypoints anywhere.'

talismans:
  - '&e&lTalismans'
  - '&7Just keep a talisman in your'
  - '&7inventory for a passive effect.'
  - '&7You do not hold or equip it.'
  - ''
  - '&eWarning:&7 many talismans are'
  - '&7consumed when they trigger, so'
  - '&7carry spares of the ones you'
  - '&7rely on. Each has a chance to'
  - '&7activate.'
  - ''
  - '&e&lExamples'
  - '&7- Miner/Farmer/Hunter: double'
  - '&7  drops'
  - '&7- Angel: cancels fall damage'
  - '&7- Lava/Fire/Water: emergency'
  - '&7  resistance'
  - '&7- Magician/Wizard: enchant luck'
  - '&7- Warrior/Knight: combat boosts'
  - ''
  - '&7&bEnder Talismans&7 also work'
  - '&7straight from your Ender Chest.'

magic:
  - '&e&lMagic & the Ancient Altar'
  - '&7Build the &eAncient Altar&7: a'
  - '&7central Altar block ringed by'
  - '&78 Ancient Pedestals.'
  - ''
  - '&7Place a catalyst on each'
  - '&7pedestal, hold the central'
  - '&7item, and &eright-click&7 the'
  - '&7altar to perform a ritual.'
  - ''
  - '&7Rituals make &bRunes&7 (a Blank'
  - '&7Rune plus an element) and other'
  - '&7magical components.'
  - ''
  - '&7The &eMagic Workbench&7 crafts'
  - '&7magical items from recipes.'
  - ''
  - '&e&lStaves'
  - '&7Staves have right-click powers:'
  - '&7- Wind Staff: launch yourself'
  - '&7- Water Staff: douse fire'
  - '&7- Storm Staff: call lightning'

armor_gadgets:
  - '&e&lArmor & Gadgets'
  - '&7Special armor sets give passive'
  - '&7powers while worn:'
  - '&7- Ender: blink/teleport tricks'
  - '&7- Slime: jump boost, no fall'
  - '&7- Cactus: thorns on attackers'
  - '&7- Hazmat: radiation immunity'
  - '&7  (full set required)'
  - '&7- Glowstone: night vision'
  - ''
  - '&e&lRechargeable gadgets'
  - '&7- Jetpacks: crouch to fly'
  - '&7- Jet Boots: dash through air'
  - '&7- Multi Tools, Magnet, Night'
  - '&7  Vision Goggles'
  - '&7- Solar Helmet: charges your'
  - '&7  gear in sunlight'
  - ''
  - '&eNote:&7 most electric gear needs'
  - '&7charging from an energy network.'

backpacks:
  - '&e&lBackpacks & Storage'
  - '&7Craft a backpack and &eright-'
  - '&eclick&7 to open its portable'
  - '&7inventory. Sizes range from'
  - '&79 slots up to a full 54.'
  - ''
  - '&7Each backpack is &eunique&7 to'
  - '&7that exact item - its contents'
  - '&7travel with it.'
  - ''
  - '&7The &bCooler&7 holds juices and'
  - '&7auto-drinks one when you get'
  - '&7hungry. Great for long trips.'
  - ''
  - '&7&bSoulbound&7 backpacks stay with'
  - '&7you when you die.'
  - ''
  - '&eWarning:&7 never put a backpack'
  - '&7inside another backpack - it is'
  - '&7blocked to protect your items.'

food_farming:
  - '&e&lFood & Farming'
  - '&7Slimefun adds easy ways to'
  - '&7handle hunger early on.'
  - ''
  - '&7The &eJuicer&7 turns fruit into'
  - '&7juices you can drink (and store'
  - '&7in a Cooler).'
  - ''
  - '&7&eJerky&7 from dried meat restores'
  - '&7lots of saturation per bite.'
  - ''
  - '&7&eOrganic Food&7, made from'
  - '&7composted crops, fuels farm'
  - '&7machines:'
  - '&7- &bAuto-Breeder&7 auto-breeds'
  - '&7  nearby animals'
  - '&7- &bProduce Collector&7 gathers'
  - '&7  milk and other products'
  - ''
  - '&7Together they keep food and'
  - '&7animals running hands-free.'

soulbound:
  - '&e&lSoulbound Items'
  - '&7A &bSoulbound&7 item stays in'
  - '&7your inventory when you die'
  - '&7instead of dropping. Perfect for'
  - '&7protecting valuable or rare gear.'
  - ''
  - '&e&lBinding an item'
  - '&71. Craft a &5Rune Anvil&7 and place it.'
  - '&72. Open it, put the item in one'
  - '&7   slot and a &eSoulbound Rune&7 in'
  - '&7   the other.'
  - '&73. Take the bound item from the'
  - '&7   output. The rune is consumed.'
  - ''
  - '&7Pre-made soulbound tools, armor'
  - '&7and backpacks also exist if you'
  - '&7prefer to craft them directly.'
  - ''
  - '&eTip:&7 bind your best gear before'
  - '&7risky trips into the Nether.'
