options:
  # Automatically download and install new Slimefun builds on startup.
  # Instead of disabling Auto Updates consider using the "stable" version of Slimefun.
  # These builds are much more tested and are far less likely to have any issues.
  # Note: When running a stable build auto-updates ONLY update to other stable builds! Perfect eh?
  # You can download the latest stable build here: https://thebusybiscuit.github.io/builds/TheBusyBiscuit/Slimefun5/stable/
  # Values: true | false
  auto-update: true
  # bStats metrics module. Reports anonymous usage stats to this fork's own bStats project (id 31272).
  # On by default (standard bStats opt-out). Set to false to disable. Values: true | false
  metrics-service: true
  # Prefix prepended to Slimefun's chat messages. Supports '&' colour/format codes.
  chat-prefix: '&a&lSlimefun 5&7> '
  # How often (in SECONDS) worn Slimefun armor effects are re-applied (also drives the Solar Helmet task).
  # Lower = more responsive perks but slightly more work per player. Values: whole number of seconds (e.g. 10).
  armor-update-interval: 10
  # Master switch for ALL armor-effect systems (armor perks, rainbow armor, solar helmet). Radiation also
  # requires this to be true - if this is false, radiation will not run even if enable-radiation is true.
  # Values: true | false
  enable-armor-effects: true
  # Enable radiation: radioactive items damage players who carry them without proper protection.
  # Only takes effect when enable-armor-effects is also true. Values: true | false
  enable-radiation: true
  # How often (in SECONDS) the radiation check runs. Values: whole number of seconds (e.g. 1).
  radiation-update-interval: 1
  # Seconds of immunity a player gets after joining before radiation can hurt them (prevents join-damage).
  # Values: whole number of seconds (e.g. 15).
  radiation-grace-period: 15
  # How often (in SECONDS) the cosmetic rainbow-armor colour cycle updates. Values: whole number of seconds.
  rainbow-armor-update-interval: 3
  # How often (in MINUTES) Slimefun auto-saves player data and block/machine data to storage.
  # Values: whole number of minutes (e.g. 10). Lower = safer against crashes but more frequent disk/DB writes.
  auto-save-delay-in-minutes: 10
  # Use the old (pre-rework) recipe/behaviour for the multiblock Ore Washer. Values: true | false
  legacy-ore-washer: false
  # Use the old recipe/behaviour for the Electric Dust Washer. Values: true | false
  legacy-dust-washer: false
  # Keep the legacy Ore Grinder recipes registered (true) instead of the reworked recipe path (false).
  # Values: true | false
  legacy-ore-grinder: true
  # Server default language for item names/lore and messages. A player who hasn't picked their own
  # language (see the 'translation' section) sees this one. Unrecognised codes fall back to 'en' with a
  # console warning. Values: a language code such as en, de, fr, es, it, ru, pl, nl, pt-BR, zh-CN, ja, id, ...
  language: en
  # Allow per-player translated item names/lore and messages at all. When false, everyone sees the server
  # default language above. Values: true | false
  enable-translations: true
  # Log an INFO line when a duplicate block entry at the same location is ignored while loading storage.
  # Useful for diagnosing corrupt/duplicated block data. Values: true | false
  log-duplicate-block-entries: true
  # (Legacy/unused) Historical radiation toggle - it is no longer read by any code and has no effect.
  # Kept only so old config files don't lose the key. Values: true | false
  burn-players-when-radioactive: true
  # When '/sf give' produces more items than fit in the target inventory, drop the excess on the ground
  # (true) instead of discarding it (false). Values: true | false
  drop-excess-sf-give-items: false
  # On shutdown, create a backup zip of Slimefun's data. Values: true | false
  backup-data: true
  # Whether Slimefun blocks broken by a creative-mode player still drop their item. Vanilla creative
  # normally voids drops; true keeps the Slimefun item. Values: true | false
  drop-block-creative: true

# Redstone auto-crafting: a dispenser that forms part of an Enhanced Crafting Table, Magic Workbench or
# Armor Forge crafts its recipe headlessly when powered by redstone (the multiblock's owner is the first
# player to build/interact with it).
auto-craft:
  # Whether a redstone auto-craft may produce a research-gated item WITHOUT its owner having unlocked the
  # research. false (default) mirrors manual crafting - the owner must be able to craft the item by hand,
  # so research-gated items only auto-craft once researched. true lets automated crafters ignore research.
  # Values: true | false
  bypass-research: false
  # DEFAULTS for the per-player redstone auto-craft sound toggles. Each player can override these in the
  # guide's Settings panel; a player who never touches them uses the value below.
  sound:
    # Whether players hear a nearby machine auto-crafting via redstone (a bit quieter than a manual craft).
    # Values: true | false
    everyone: true
    # Whether the craft sounds play when a player manually crafts at a multiblock by clicking it (ownership
    # is irrelevant - it's simply whether the crafting player hears the sounds). Values: true | false
    manual: true

# Where Slimefun stores block/machine/chunk data.
storage:
  # 'h2' = embedded database (default). 'mysql' = an external MySQL/MariaDB server, configured below.
  # 'legacy' = the old flat-file format (.sfb/.sfc/.sfi).
  # Existing servers auto-migrate their flat-file data to the database on first boot, keeping a
  # '*.migrated-backup-*' copy. Set 'legacy' to stay on flat files.
  # Player data currently always uses legacy storage regardless of this setting.
  # The H2/MySQL JDBC driver is downloaded once into plugins/Slimefun/libraries/ on first use (it is
  # not bundled in the jar). A server with no internet access can place the driver jar there manually;
  # if the driver is unavailable, Slimefun falls back to 'legacy' storage for that boot and logs why.
  # Values: h2 | mysql | legacy
  backend: h2
  # Only used when 'backend' is set to 'mysql' above. The database must already exist and the user must
  # have privileges to create tables in it; Slimefun creates its own tables on first connect.
  mysql:
    # The hostname or IP address of your MySQL/MariaDB server.
    host: localhost
    # The port your MySQL/MariaDB server listens on. Default MySQL port is 3306.
    port: 3306
    # The name of the database Slimefun should use (must already exist).
    database: slimefun
    # The username Slimefun should authenticate as.
    username: root
    # The password for the above username.
    password: ""
    # Extra JDBC URL parameters, appended as-is after a '?'. Adjust only if you know what you need
    # (e.g. set useSSL=true when your server requires TLS).
    extra-params: "useSSL=false&allowPublicKeyRetrieval=true&characterEncoding=utf8"

guide:
  # Show the vanilla crafting recipe alongside Slimefun items in the guide where one exists.
  # Values: true | false
  show-vanilla-recipes: true
  # Give every player a Slimefun Guide book automatically the first time they join. Values: true | false
  receive-on-first-join: true
  # Include item groups flagged as hidden when a player searches the guide. Values: true | false
  show-hidden-item-groups-in-search: false
  # Default for grouping the guide's main menu into themes (the reworked layout). Set to false for the
  # classic flat main menu that lists every category directly. This is only the DEFAULT - each player can
  # override it in the guide's Settings panel ("Main Menu: Categorized/Classic"). Values: true | false
  categorize-main-menu: true
  # When false, guide buttons that open an external website outside the settings panel (item wiki
  # pages, contributor profiles, the addon list) are hidden. Leave true to keep them.
  external-links: true
  # Per-button visibility for the guide's settings panel (top + bottom rows). Set any to false to
  # hide it; the row re-centers automatically. The Wiki button is always shown and can't be hidden.
  settings-buttons:
    credits: true
    versions: true
    source: true
    discord: true
    installer: true
    bug-reports: true
    config-editor: true
  # When true, players without the slimefun.installer permission can still OPEN the Addon Installer
  # to browse installed/available addons (read-only - no install/update/build buttons).
  show-addon-installer-to-everyone: true
  # Dev helper: when true, dumps the English baseline of every block menu to menus-baseline.yml on
  # startup (for producing translations). Leave false in production.
  dump-menu-baseline: false
  # Who may use the Cheat Sheet (creative-style free-item access). Access is granted if ANY enabled
  # rule below matches. Admin-only setting. Defaults: OPs and holders of slimefun.cheat.items.
  cheat-sheet:
    allow-creative: false
    allow-op: true
    allow-permission: true
    allow-everyone: false

# In-game bug reporting (the "Report a Bug" button in the guide settings). Reports are posted by the
# server using the credentials below and credit the reporting player by name. Leave a field empty to
# disable that channel; with both empty, reports cannot be delivered.
bug-reports:
  enabled: true
  # Our hosted relay forwards reports to the Slimefun5 community Discord. The relay holds the webhook
  # server-side, so nothing sensitive ships in the jar. When set, the direct webhook below is ignored.
  # Leave blank to use the built-in relay; point it at your own relay to override. To turn the in-game
  # reporter off entirely, set enabled: false above.
  relay-url: 'https://slimefun5-bot.finn-089.workers.dev/report'
  # Minimum seconds a player must wait between submitting reports (per-player anti-spam).
  cooldown-seconds: 60
  github:
    # A GitHub token with 'repo' scope (issues write access). Required to open issues; empty disables it.
    token: ''
    owner: 'Slimefun5'
  discord:
    # A Discord webhook URL to mirror reports to. Empty disables Discord posting.
    webhook-url: ''

# In-game config editor: a chest GUI (via /sf config or the guide's settings panel) that lets admins
# edit this config. Admin-only (OP or slimefun.config-editor). IMPORTANT: this switch can ONLY be
# changed here in the file - the editor hides the whole config-editor section, so it can never be
# toggled from in-game. Note: editing via the GUI rewrites config.yml and does not keep comments.
config-editor:
  enabled: true

installer:
  # Optional GitHub token for the in-game addon installer. Unauthenticated GitHub API access is limited
  # to 60 requests/hour (shared per server IP), which the installer can exhaust quickly and then reports
  # addons as "unavailable". A token (a fine-grained PAT with no scopes / public read is enough) raises
  # this to 5000/hour. Leave blank to run unauthenticated.
  github-token: ''

researches:
  # Creative-mode players unlock researches for free (no level/XP cost). Values: true | false
  free-in-creative-mode: true
  # Launch a celebratory firework when a player completes a research. Values: true | false
  enable-fireworks: true
  # Skip the "learning" animation (particles/title) shown when unlocking a research. Values: true | false
  disable-learning-animation: false

# Block-loading and machine-ticking timings. ("URID" is a legacy section name carried over from
# upstream Slimefun and has no documented meaning - the keys below control tickers and load logging.)
URID:
  # How often (in MILLISECONDS) the "Loading Blocks... X% done" progress line is logged while loading a
  # world's blocks at startup. Values: whole number of milliseconds (e.g. 3000).
  info-delay: 3000
  # The machine/block ticker interval, in Minecraft TICKS (20 ticks = 1 second). This is how often
  # ticking Slimefun machines run their logic. Lower = faster machines but more server load.
  # Values: whole number of ticks (e.g. 10).
  custom-ticker-delay: 10
  # Master switch for all block tickers. When false, every item that ticks (machines, generators, etc.)
  # is disabled at startup. Values: true | false
  enable-tickers: true

networks:
  # Maximum number of nodes (blocks) a single energy or cargo network may contain. Must be at least 1.
  # Values: whole number (e.g. 200).
  max-size: 200
  # Extra delay for cargo-network processing, measured in TICKER CYCLES (multiples of URID.custom-ticker-delay
  # above), NOT raw Minecraft ticks. 0 = process cargo every ticker cycle. Raise it to ease cargo load.
  # Values: whole number (e.g. 0).
  cargo-ticker-delay: 0
  # Enable the in-game network visualizer (particles showing a network's shape/nodes). Values: true | false
  enable-visualizer: true
  # When a cargo network cannot place items anywhere, void (delete) the excess instead of keeping/dropping
  # it. Values: true | false
  delete-excess-items: false

talismans:
  # Send talisman trigger messages via the action bar (above the hotbar) when true, or in normal chat
  # when false. Values: true | false
  use-actionbar: true

# The bStats-based metrics module (separate from options.metrics-service above). Off by default on this
# fork - these only matter if that module is enabled.
metrics:
  # Let the metrics module auto-download its own updates. Values: true | false
  auto-update: true
  # Enable the separate analytics service. Values: true | false
  analytics: true

translation:
  # Rewrite item name/lore per viewer via packets so each player sees their own language.
  # Values: true | false
  packets: true
  # What a missing translation label falls back to: 'english' or 'id' (the raw Slimefun id).
  # Values: english | id
  fallback: english
  # For players who haven't picked a Slimefun language in the guide:
  # 'client' = use their Minecraft client language when it's installed, else the server default.
  # 'server' = always use the server's default language (options.language above).
  # Values: client | server
  language-source: client

# Ordered list of research rank titles, from lowest to highest. A player's title is chosen by the
# percentage of all researches they've unlocked: the list is split evenly across 0%-100%, so the first
# entry is shown at 0 researches and the last at 100%. Edit/reorder freely, but the list must not be empty.
research-ranks:
- Chicken
- Cow
- Spider
- Villager
- Beginner
- Clumsy Student
- Unskilled Student
- Incompetent Student
- Student
- Clumsy Apprentice
- Apprentice
- Skilled Apprentice
- Upcoming Mage
- Excellent Mage
- Young Magician
- Incompetent Magician
- Common Magician
- Magician
- Proficient Magician
- Skilled Magician
- Accustomed Magician
- Great Magician
- Clumsy Wizard
- Wizard
- Common Wizard
- Skilled Wizard
- Great Wizard
- Impressive Wizard
- Young Master
- Clumsy Master
- Upcoming Master
- Competent Master
- Master
- Skilled Master
- Excellent Master
