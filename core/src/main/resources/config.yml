options:
  # Instead of disabling Auto Updates consider using the "stable" version of Slimefun.
  # These builds are much more tested and are far less likely to have any issues.
  # Note: When running a stable build auto-updates ONLY update to other stable builds! Perfect eh?
  # You can download the latest stable build here: https://thebusybiscuit.github.io/builds/TheBusyBiscuit/Slimefun5/stable/

  auto-update: true
  # bStats metrics module. Off by default on this fork: the module targets the old slimefun4 package and
  # its data would report to upstream Slimefun's bStats project, not this fork. Enable only if you know why.
  metrics-service: false
  chat-prefix: '&a&lSlimefun 5&7> '
  armor-update-interval: 10
  enable-armor-effects: true
  enable-radiation: true
  radiation-update-interval: 1
  radiation-grace-period: 15
  rainbow-armor-update-interval: 3
  auto-save-delay-in-minutes: 10
  legacy-ore-washer: false
  legacy-dust-washer: false
  legacy-ore-grinder: true
  language: en
  enable-translations: true
  log-duplicate-block-entries: true
  burn-players-when-radioactive: true
  drop-excess-sf-give-items: false
  backup-data: true
  drop-block-creative: true

# Where Slimefun stores block/machine/chunk data.
storage:
  # 'legacy' = flat files (default). 'h2' = embedded H2 database (recommended for large servers).
  # Player data currently always uses legacy storage regardless of this setting.
  backend: legacy

guide:
  show-vanilla-recipes: true
  receive-on-first-join: true
  show-hidden-item-groups-in-search: false
  # When false, guide buttons that open an external website outside the settings panel (item wiki
  # pages, contributor profiles, the addon list) are hidden. Leave true to keep them.
  external-links: true
  # Per-button visibility for the guide's settings panel (top + bottom rows). Set any to false to
  # hide it; the row re-centers automatically. The Wiki button is always shown and can't be hidden.
  settings-buttons:
    credits: true
    versions: true
    source: true
    discord: true
    installer: true
    bug-reports: true
    config-editor: true
  # When true, players without the slimefun.installer permission can still OPEN the Addon Installer
  # to browse installed/available addons (read-only - no install/update/build buttons).
  show-addon-installer-to-everyone: true
  # Dev helper: when true, dumps the English baseline of every block menu to menus-baseline.yml on
  # startup (for producing translations). Leave false in production.
  dump-menu-baseline: false
  # Who may use the Cheat Sheet (creative-style free-item access). Access is granted if ANY enabled
  # rule below matches. Admin-only setting. Defaults: OPs and holders of slimefun.cheat.items.
  cheat-sheet:
    allow-creative: false
    allow-op: true
    allow-permission: true
    allow-everyone: false

# In-game bug reporting (the "Report a Bug" button in the guide settings). Reports are posted by the
# server using the credentials below and credit the reporting player by name. Leave a field empty to
# disable that channel; with both empty, reports cannot be delivered.
bug-reports:
  enabled: true
  # Our hosted relay forwards reports to the Slimefun5 community Discord. The relay holds the webhook
  # server-side, so nothing sensitive ships in the jar. When set, the direct webhook below is ignored.
  # Leave blank to use the built-in relay; point it at your own relay to override. To turn the in-game
  # reporter off entirely, set enabled: false above.
  relay-url: 'https://slimefun5-bot.finn-089.workers.dev/report'
  # Minimum seconds a player must wait between submitting reports (per-player anti-spam).
  cooldown-seconds: 60
  github:
    # A GitHub token with 'repo' scope (issues write access). Required to open issues; empty disables it.
    token: ''
    owner: 'Slimefun5'
  discord:
    # A Discord webhook URL to mirror reports to. Empty disables Discord posting.
    webhook-url: ''

# In-game config editor: a chest GUI (via /sf config or the guide's settings panel) that lets admins
# edit this config. Admin-only (OP or slimefun.config-editor). IMPORTANT: this switch can ONLY be
# changed here in the file - the editor hides the whole config-editor section, so it can never be
# toggled from in-game. Note: editing via the GUI rewrites config.yml and does not keep comments.
config-editor:
  enabled: true

installer:
  # Optional GitHub token for the in-game addon installer. Unauthenticated GitHub API access is limited
  # to 60 requests/hour (shared per server IP), which the installer can exhaust quickly and then reports
  # addons as "unavailable". A token (a fine-grained PAT with no scopes / public read is enough) raises
  # this to 5000/hour. Leave blank to run unauthenticated.
  github-token: ''

researches:
  free-in-creative-mode: true
  enable-fireworks: true
  disable-learning-animation: false

URID:
  info-delay: 3000
  custom-ticker-delay: 10
  enable-tickers: true

networks:
  max-size: 200
  cargo-ticker-delay: 0
  enable-visualizer: true
  delete-excess-items: false

talismans:
  use-actionbar: true

metrics:
  auto-update: true
  analytics: true

translation:
  # Rewrite item name/lore per viewer via packets so each player sees their own language.
  packets: true
  # What a missing translation label falls back to: 'english' or 'id' (the raw Slimefun id).
  fallback: english
  # For players who haven't picked a Slimefun language in the guide:
  # 'client' = use their Minecraft client language when it's installed, else the server default.
  # 'server' = always use the server's default language.
  language-source: client

